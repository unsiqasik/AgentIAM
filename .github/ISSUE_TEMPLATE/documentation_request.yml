name: Documentation Request
description: Request improvements or additions to documentation
labels: ["category:documentation"]
body:
  - type: textarea
    id: docs-description
    attributes:
      label: What documentation is missing or needs improvement?
      placeholder: Describe the documentation task.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this important?
      placeholder: Explain why this documentation is needed.
