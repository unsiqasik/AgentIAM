name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    - name: Run Bandit
      run: bandit -r backend/app -ll
    - name: Run Safety
      run: safety check -r backend/requirements.txt
      continue-on-error: true # Safety sometimes fails on dev environments due to database lag/API keys
