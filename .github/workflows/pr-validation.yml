name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    needs: [lint, test, security, type-check]
    if: always()
    steps:
    - name: Check overall status
      run: |
        if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.security.result }}" == "success" && "${{ needs.type-check.result }}" == "success" ]]; then
          echo "All checks passed!"
          exit 0
        else
          echo "One or more checks failed."
          exit 1
        fi
